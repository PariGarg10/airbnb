services:
  - type: web
    name: airbnb-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_URL
        sync: false
    disk:
      name: airbnb-data
      mountPath: /var/data
      sizeGB: 1
